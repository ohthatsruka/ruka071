<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruka071</title>
  <link rel="icon" href="https://png.pngtree.com/png-vector/20240314/ourmid/pngtree-angry-green-skull-ice-cream-mascot-cartoon-style-png-image_11953735.png">
  <link href="https://fonts.cdnfonts.com/css/nitro-break" rel="stylesheet">
  <style>
    /* reset básico */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: black;
      color: #39ff14; /* verde the skuaker haker 7u7*/
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #matrix {
      position: absolute;
      top: 0; left: 0;
      z-index: -1; 
    }

    /* bordes oscuros */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, transparent 10%, rgba(0, 0, 0, 0.9) 100%);
      pointer-events: none;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #wordmark {
      font-family: 'Nitro Break', sans-serif;
      font-size: 8rem;
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
      cursor: default;
      user-select: none;
    }

    /* hacer que las letras reboten */
    #wordmark span {
      display: inline-block;
      transition: all 0.2s ease;
    }

    #wordmark span:hover {
      color: white;
      transform: scale(1.1) translateY(-10px);
      text-shadow: 0 0 20px #39ff14;
    }

    .socials {
      margin-top: 30px;
      text-align: center;
    }

    .socials p {
      font-size: 1.2rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    #discord-btn {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 3px;
      padding: 10px 30px;
      border: 2px solid #39ff14;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      transition: 0.3s;
    }

    #discord-btn:hover {
      background: #39ff14;
      color: black;
      box-shadow: 0 0 30px #39ff14;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      #wordmark { font-size: 4rem; }
      #discord-btn { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>
  <div class="overlay"></div>

  <div class="container">
    <h1 id="wordmark"></h1>
    <div class="socials">
      <p>telegram: @sodomizador</p>
      <a id="discord-btn" href="https://discord.gg/hPGzMTeDDD" target="_blank">JOIN</a>
    </div>
  </div>

  <script>
    // separar el título mmmmmmmmm
    let titleStr = "ruka071";
    let titleEl = document.getElementById("wordmark");
    for(let i=0; i<titleStr.length; i++) {
      titleEl.innerHTML += `<span>${titleStr[i]}</span>`;
    }

    // merda de la lluvia matrix super tuff 7o7
    var c = document.getElementById("matrix");
    var ctx = c.getContext("2d");

    c.width = window.innerWidth;
    c.height = window.innerHeight;

    var chars = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    chars = chars.split("");

    var font_size = 16;
    var columns = c.width / font_size;
    var drops = [];
    
    // escalonar las gotas iniciales
    for(var x = 0; x < columns; x++) {
      drops[x] = Math.random() * -100; 
    }

    let mouseX = -999;
    let mouseY = -999;

    window.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('resize', function() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      // no recalcula las columnas perfectamente meh, funciona
    })

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.font = font_size + "px monospace";

      for(var i = 0; i < drops.length; i++) {
        var text = chars[Math.floor(Math.random() * chars.length)];
        
        let dropX = i * font_size;
        let dropY = drops[i] * font_size;

        // comprobar si está cerca del ratón para iluminar
        let dist = Math.sqrt(Math.pow(dropX - mouseX, 2) + Math.pow(dropY - mouseY, 2));

        if (dist < 150) {
          ctx.fillStyle = "#fff";
        } else {
          ctx.fillStyle = "#0F0"; // verde mmmmmmmmmmm
        }

        ctx.fillText(text, dropX, dropY);

        if(drops[i] * font_size > c.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    // console.log("ejecutando matrix...");
    setInterval(draw, 33); // 30fps maso menos
  </script>

</body>
</html>
